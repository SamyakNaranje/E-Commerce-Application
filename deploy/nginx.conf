# Replace shop.example.com and provision TLS certificates before deployment.
limit_req_zone $binary_remote_addr zone=shop_api:10m rate=10r/s;
server {
 listen 80;
 server_name shop.example.com;
 return 308 https://shop.example.com$request_uri;
}
server {
 listen 443 ssl;
 server_name shop.example.com;
 ssl_certificate /etc/letsencrypt/live/shop.example.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 1m;
 client_header_timeout 10s;
 client_body_timeout 15s;
 location / {
  proxy_pass http://127.0.0.1:8080;
  proxy_set_header Host shop.example.com;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
 }
 location /api/ {
  limit_req zone=shop_api burst=30 nodelay;
  limit_req_status 429;
  proxy_pass http://127.0.0.1:8080;
  proxy_set_header Host shop.example.com;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
 }
}
