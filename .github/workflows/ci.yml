name: Application CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go mod tidy
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -cover ./...
      - run: node --check assets/shop.js
      - run: node --check assets/storefront.js
